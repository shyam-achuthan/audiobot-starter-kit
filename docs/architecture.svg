  <text x="820" y="646" class="lbl">playback</text>

  <!-- ============ Legend ============ -->
  <path d="M310 772 H350" class="audio"/>
  <text x="360" y="777" class="lbl">live audio (WebRTC / SIP)</text>
  <path d="M560 772 H600" class="data"/>
  <text x="610" y="777" class="lbl">data and API calls</text>
  <text x="1280" y="777" class="lbl" text-anchor="end">every model is a cloud API behind a LiteLLM alias or a Sarvam key</text>
</svg>
