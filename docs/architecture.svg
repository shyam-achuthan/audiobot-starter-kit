<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d">
  <title id="t">AudioBots architecture</title>
  <desc id="d">Website and phone callers reach LiveKit (WebRTC) or the LiveKit SIP bridge. The Python voice agent streams audio to Sarvam speech-to-text and text-to-speech in the cloud and reaches hosted LLMs through LiteLLM. The NestJS API stores calls, leads, tickets and knowledge in Postgres, records calls through LiveKit Egress into RustFS, and syncs to Twenty CRM, Chatwoot and webhooks. The Next.js dashboard talks to the API.</desc>
  <style>
    :root {
      --bg: #ffffff; --ink: #18181b; --ink2: #52525b; --ink3: #71717a; --line: #a1a1aa;
      --frame: #d4d4d8; --frame-bg: #fafafa;
      --card: #ffffff; --card-line: #e4e4e7;
      --blue: #2563eb; --blue-bg: #eff6ff;
      --violet: #7c3aed; --violet-bg: #f5f3ff;
      --teal: #0f766e; --teal-bg: #f0fdfa;
      --amber: #b45309; --amber-bg: #fffbeb;
      --slate: #334155; --slate-bg: #f1f5f9;
      --rose: #be123c; --rose-bg: #fff1f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #f4f4f5; --ink2: #c4c4cc; --ink3: #9ca3af; --line: #6b7280;
        --frame: #30363d; --frame-bg: #111821;
        --card: #161b22; --card-line: #30363d;
        --blue: #60a5fa; --blue-bg: #0f1d33;
        --violet: #a78bfa; --violet-bg: #1c1433;
        --teal: #2dd4bf; --teal-bg: #0b2420;
        --amber: #fbbf24; --amber-bg: #2a1f08;
        --slate: #cbd5e1; --slate-bg: #1a2230;
        --rose: #fb7185; --rose-bg: #2a0f17;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .frame { fill: var(--frame-bg); stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .group { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: var(--ink3); }
    .h { font-size: 19px; font-weight: 700; }
    .s { font-size: 14px; fill: var(--ink2); }
    .xs { font-size: 13px; fill: var(--ink2); }
    .lbl { font-size: 12.5px; fill: var(--ink3); }
    .pill-t { font-size: 13.5px; font-weight: 600; }
    .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.5; }
    .blue { fill: var(--blue-bg); stroke: var(--blue); stroke-width: 1.5; }
    .violet { fill: var(--violet-bg); stroke: var(--violet); stroke-width: 1.5; }
    .teal { fill: var(--teal-bg); stroke: var(--teal); stroke-width: 2; }
    .amber { fill: var(--amber-bg); stroke: var(--amber); stroke-width: 1.5; }
    .slate { fill: var(--slate-bg); stroke: var(--slate); stroke-width: 1.5; }
    .rose { fill: var(--rose-bg); stroke: var(--rose); stroke-width: 1.5; }
    .pill { fill: var(--card); stroke: var(--teal); stroke-width: 1.2; }
    .pill2 { fill: var(--card); stroke: var(--card-line); stroke-width: 1.2; }
    .bar-blue { fill: var(--blue); } .bar-violet { fill: var(--violet); } .bar-teal { fill: var(--teal); }
    .bar-amber { fill: var(--amber); } .bar-slate { fill: var(--slate); } .bar-rose { fill: var(--rose); }
    .audio { fill: none; stroke: var(--violet); stroke-width: 2.5; }
    .data { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 7 5; }
    .head-a { fill: var(--violet); } .head-d { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-a"/></marker>
    <marker id="dm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-d"/></marker>
  </defs>

  <rect width="1600" height="800" rx="20" class="bg"/>

  <!-- ============ Cloud APIs ============ -->
  <rect x="545" y="22" width="575" height="104" rx="14" class="frame"/>
  <text x="563" y="44" class="group">CLOUD APIS · NO GPU</text>
  <rect x="565" y="54" width="170" height="58" rx="10" class="amber"/>
  <text x="583" y="79" class="h" font-size="16">Sarvam STT</text>
  <text x="583" y="99" class="xs">saaras · 6 languages</text>
  <rect x="745" y="54" width="170" height="58" rx="10" class="amber"/>
  <text x="763" y="79" class="h" font-size="16">Sarvam TTS</text>
  <text x="763" y="99" class="xs">bulbul · 6 languages</text>
  <rect x="930" y="54" width="170" height="58" rx="10" class="amber"/>
  <text x="948" y="79" class="h" font-size="16">Hosted LLMs</text>
  <text x="948" y="99" class="xs">Gemini · GPT · Claude</text>

  <!-- ============ Callers ============ -->
  <text x="40" y="196" class="group">CALLERS</text>
  <rect x="40" y="210" width="220" height="70" rx="12" class="blue"/>
  <rect x="40" y="222" width="5" height="46" rx="2.5" class="bar-blue"/>
  <text x="60" y="240" class="h">Website widget</text>
  <text x="60" y="262" class="xs">one &lt;script&gt; tag · captions</text>
  <rect x="40" y="300" width="220" height="70" rx="12" class="blue"/>
  <rect x="40" y="312" width="5" height="46" rx="2.5" class="bar-blue"/>
  <text x="60" y="330" class="h">Demo page</text>
  <text x="60" y="352" class="xs">talk in the browser</text>
  <rect x="40" y="470" width="220" height="70" rx="12" class="blue"/>
  <rect x="40" y="482" width="5" height="46" rx="2.5" class="bar-blue"/>
  <text x="60" y="500" class="h">Phone call</text>
  <text x="60" y="522" class="xs">SIP trunk · in &amp; out</text>

  <!-- ============ Docker host ============ -->
  <rect x="290" y="160" width="1010" height="590" rx="18" class="frame"/>
  <text x="310" y="186" class="group">YOUR SERVER · DOCKER COMPOSE</text>

  <!-- LiveKit -->
  <rect x="340" y="210" width="200" height="190" rx="12" class="violet"/>
  <text x="360" y="242" class="h">LiveKit</text>
  <text x="360" y="264" class="s">WebRTC media server</text>
  <text x="360" y="300" class="xs">rooms · tokens</text>
  <text x="360" y="320" class="xs">barge-in friendly,</text>
  <text x="360" y="338" class="xs">streams every frame</text>
  <rect x="340" y="470" width="200" height="70" rx="12" class="violet"/>
  <text x="360" y="500" class="h">SIP bridge</text>
  <text x="360" y="522" class="xs">calls ↔ LiveKit rooms</text>

  <!-- Agent -->
  <rect x="600" y="210" width="280" height="350" rx="14" class="teal"/>
  <text x="620" y="242" class="h" font-size="21">Voice agent</text>
  <text x="620" y="264" class="s">Python · LiveKit Agents</text>
  <rect x="612" y="282" width="76" height="32" rx="16" class="pill"/>
  <text x="650" y="303" class="pill-t" text-anchor="middle">STT</text>
  <rect x="702" y="282" width="76" height="32" rx="16" class="pill"/>
  <text x="740" y="303" class="pill-t" text-anchor="middle">LLM</text>
  <rect x="792" y="282" width="76" height="32" rx="16" class="pill"/>
  <text x="830" y="303" class="pill-t" text-anchor="middle">TTS</text>
  <path d="M689 298 H700" class="data" stroke-dasharray="none" marker-end="url(#dm)"/>
  <path d="M779 298 H790" class="data" stroke-dasharray="none" marker-end="url(#dm)"/>
  <text x="620" y="346" class="lbl">WORKFLOWS</text>
  <rect x="616" y="356" width="122" height="32" rx="8" class="pill2"/>
  <text x="677" y="377" class="pill-t" text-anchor="middle">Receptionist</text>
  <rect x="744" y="356" width="122" height="32" rx="8" class="pill2"/>
  <text x="805" y="377" class="pill-t" text-anchor="middle">Sales</text>
  <rect x="616" y="394" width="122" height="32" rx="8" class="pill2"/>
  <text x="677" y="415" class="pill-t" text-anchor="middle">Support</text>
  <rect x="744" y="394" width="122" height="32" rx="8" class="pill2"/>
  <text x="805" y="415" class="pill-t" text-anchor="middle">Lead qualify</text>
  <text x="620" y="460" class="lbl">TOOLS</text>
  <text x="620" y="482" class="xs">leads · tickets · callbacks</text>
  <text x="620" y="502" class="xs">knowledge search · transfer</text>
  <text x="620" y="522" class="xs">recording consent · handoffs</text>
  <text x="620" y="546" class="lbl">~3 s median voice-to-voice</text>

  <!-- LiteLLM / API / Dashboard column -->
  <rect x="930" y="210" width="170" height="70" rx="12" class="slate"/>
  <text x="948" y="240" class="h">LiteLLM</text>
  <text x="948" y="262" class="xs">model aliases</text>
  <rect x="930" y="320" width="170" height="150" rx="12" class="slate"/>
  <text x="948" y="350" class="h">API</text>
  <text x="948" y="372" class="s">NestJS</text>
  <text x="948" y="400" class="xs">calls · leads · tickets</text>
  <text x="948" y="420" class="xs">knowledge · recordings</text>
  <text x="948" y="440" class="xs">phone · widgets · auth</text>
  <text x="948" y="460" class="xs">webhook outbox</text>
  <rect x="930" y="520" width="170" height="70" rx="12" class="slate"/>
  <text x="948" y="550" class="h">Dashboard</text>
  <text x="948" y="572" class="xs">Next.js · widget.js</text>

  <!-- Right inner column -->
  <rect x="1140" y="210" width="140" height="70" rx="12" class="card"/>
  <text x="1158" y="240" class="h">Langfuse</text>
  <text x="1158" y="262" class="xs">LLM traces</text>
  <rect x="1140" y="330" width="140" height="70" rx="12" class="card"/>
  <text x="1158" y="360" class="h">Postgres</text>
  <text x="1158" y="382" class="xs">+ pgvector</text>

  <!-- Recording row -->
  <rect x="340" y="620" width="200" height="70" rx="12" class="card"/>
  <text x="360" y="650" class="h">Egress</text>
  <text x="360" y="672" class="xs">records the call · OGG</text>
  <rect x="600" y="620" width="200" height="70" rx="12" class="card"/>
  <text x="620" y="650" class="h">RustFS</text>
  <text x="620" y="672" class="xs">S3 storage · retention</text>

  <!-- ============ Outside right ============ -->
  <text x="1340" y="196" class="group">YOUR SYSTEMS</text>
  <rect x="1340" y="300" width="220" height="200" rx="14" class="rose"/>
  <text x="1360" y="330" class="lbl">SYNCED AUTOMATICALLY</text>
  <rect x="1356" y="344" width="188" height="40" rx="9" class="card"/>
  <text x="1372" y="369" class="pill-t">Twenty CRM · leads</text>
  <rect x="1356" y="392" width="188" height="40" rx="9" class="card"/>
  <text x="1372" y="417" class="pill-t">Chatwoot · tickets</text>
  <rect x="1356" y="440" width="188" height="40" rx="9" class="card"/>
  <text x="1372" y="465" class="pill-t">Signed webhooks</text>
  <rect x="1340" y="520" width="220" height="70" rx="12" class="blue"/>
  <rect x="1555" y="532" width="5" height="46" rx="2.5" class="bar-blue"/>
  <text x="1360" y="550" class="h">Your team</text>
  <text x="1360" y="572" class="xs">admins · agents · viewers</text>

  <!-- ============ Wires: audio (solid) ============ -->
  <path d="M260 245 H338" class="audio" marker-end="url(#a)"/>
  <path d="M260 335 H338" class="audio" marker-end="url(#a)"/>
  <path d="M260 505 H338" class="audio" marker-end="url(#a)"/>
  <path d="M440 470 V402" class="audio" marker-end="url(#a)"/>
  <path d="M542 305 H598" class="audio" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="550" y="296" class="lbl">audio</text>
  <path d="M650 208 V114" class="audio" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M830 208 V114" class="audio" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M542 380 H568 V640 H542" class="audio" marker-end="url(#a)"/>
  <path d="M542 670 H598" class="data" marker-end="url(#dm)"/>

  <!-- ============ Wires: data (dashed) ============ -->
  <path d="M882 245 H928" class="data" marker-end="url(#dm)"/>
  <path d="M1015 208 V114" class="data" marker-end="url(#dm)"/>
  <path d="M1102 245 H1138" class="data" marker-end="url(#dm)"/>
  <path d="M882 395 H928" class="data" marker-start="url(#dm)" marker-end="url(#dm)"/>
