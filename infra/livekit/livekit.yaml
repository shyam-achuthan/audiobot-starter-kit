# LiveKit server config (local dev). API keys come from the LIVEKIT_KEYS env var,
# node IP from the --node-ip flag (see docker-compose.yml).
port: 7880
rtc:
  tcp_port: 7881
  # Small UDP range keeps Docker Desktop port publishing fast on macOS.
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
redis:
  address: redis:6379
room:
  empty_timeout: 60
  departure_timeout: 20
logging:
  level: info
