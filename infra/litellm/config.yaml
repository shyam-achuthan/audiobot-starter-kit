# LiteLLM gateway. Agents and the API only ever call these aliases,
# so providers can be swapped here without code changes.
model_list:
  # ---- Conversation models ----
  # Benchmarked 2026-11-15 from India, WITH tools attached (time to a tool call):
  #   gemini-3.5-flash (thinking off)          ~0.7s   <- default for voice
  #   gemini-3.5-flash-lite (thinking off)     ~3s
  #   gemini-flash-lite-latest                 4.5-8.5s (now thinks before tool calls)
  #   gemini-3.8-flash / flash-latest: thinking can't go below "low", >30s
  - model_name: agent-fast
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: disable
  - model_name: agent-lite
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: agent-fast-fallback
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # Better reasoning for complex sales/support turns; thinking disabled for latency.
  - model_name: agent-smart
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: disable
  - model_name: agent-claude
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- Embedding models (selectable per knowledge base) ----
  - model_name: embed-gemini
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
  - model_name: embed-vertex
    litellm_params:
      model: vertex_ai/gemini-embedding-001
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
  - model_name: embed-bedrock-cohere
    litellm_params:
      model: bedrock/cohere.embed-multilingual-v3
      aws_region_name: os.environ/AWS_REGION_NAME
  # OpenRouter embeddings + local BGE-M3 are added in Phase 3.

router_settings:
  # On a quota/rate-limit error, move to the next model immediately instead of
  # retrying (Gemini free tier: 20 requests/day per model; retries just add
  # ~20 s of silence on a live call).
  fallbacks:
    - agent-fast: ["agent-lite", "agent-fast-fallback"]
    - agent-smart: ["agent-fast", "agent-lite"]
    - agent-claude: ["agent-fast"]
  retry_policy:
    RateLimitErrorRetries: 0
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
  allowed_fails: 1
  cooldown_time: 60
  timeout: 20

litellm_settings:
  drop_params: true
  # Phase 6: every LLM call is traced in the self-hosted Langfuse (observability profile) over
  # OpenTelemetry (Langfuse v4 accepts OTel only).
  # The agent tags requests with metadata.session_id = call id, so one call = one Langfuse session.
  # Without Langfuse running, LiteLLM logs a warning and calls are unaffected.
  callbacks: ["langfuse_otel"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
